{% extends 'admin_base.html' %}
{% block content %}
<div class="max-w-lg mx-auto bg-white shadow-lg rounded-lg p-8">
  <h2 class="text-2xl font-bold mb-6">Upload New Candidate Resume</h2>

  <form method="POST" enctype="multipart/form-data" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-gray-700">Resume File (.pdf, .docx)</label>
      <input type="file" name="resume_file" accept=".pdf,.docx" 
             class="w-full border rounded-md px-3 py-2" required>
    </div>

    <div class="flex justify-between mt-6">
      <a href="{% url 'manage_candidates' %}" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">Cancel</a>
      <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">Upload and Parse</button>
    </div>
  </form>
</div>
{% endblock %}
